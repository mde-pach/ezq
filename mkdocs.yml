site_name: ezvent Documentation
site_description: A Python framework for event-driven systems using PostgreSQL
site_url: https://ezvent-docs.example.com/
repo_url: https://github.com/yourusername/ezvent
repo_name: ezvent
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
    - media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/ezvent
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

extra_css:
  - css/custom.css
  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true
  - attr_list
  - def_list
  - md_in_html

plugins:
  - search
  # API documentation with improved configuration
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            filters:
              - "!^_"  # exclude private members
            merge_init_into_class: true
            docstring_section_style: spacy
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  # Generate API docs
  - gen-files:
      scripts:
        - docs/generate_api_docs.py
  # Include markdown from other files
  - include-markdown
  # Variables and macros in markdown
  - macros
  # Improved code includes
  - codeinclude
  # Meta descriptions for SEO
  - meta-descriptions
  # Other useful plugins
  - autorefs
  - git-revision-date-localized:
      type: timeago
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false

# Standard navigation structure
nav:
  - Get Started:
      - Welcome to ezvent: index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - User Guide:
      - Events: user-guide/events.md
      - Handlers: user-guide/handlers.md
      - Configuration: user-guide/configuration.md
  - Technical Details:
      - Queue System: implementation/ezq.md
  - API Reference:
      - Overview: api/index.md
      - ezvent API:
          - Overview: api/ezvent/index.md
          - EZvent: api/ezvent/ezvent.md
          - Events: api/ezvent/events.md
          - Handlers: api/ezvent/handlers.md
      - ezq API:
          - Overview: api/ezq/index.md
          - Configuration: api/ezq/configuration.md
          - Consumer: api/ezq/consumer.md
          - EZQConfig: api/ezq/config.md
          - Queue: api/ezq/queue.md

# API Reference will be auto-generated by mkdocs-autoapi