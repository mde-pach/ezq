site_name: EZQ Documentation
site_description: Documentation for the EZQ event processing library
site_url: https://ezq-docs.example.com/
repo_url: https://github.com/yourusername/ezq
repo_name: ezq
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - toc:
      permalink: true
  - attr_list
  - def_list
  - md_in_html

plugins:
  - search
  # Better page navigation control
  - awesome-pages
  # Required by mkdocs-autoapi
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  # API documentation with automatic generation
  - mkdocs-autoapi:
      autoapi_dir: src
      autoapi_file_patterns: ["*.py", "*.pyi"]
      autoapi_ignore: ["**/venv/**", "**/.venv/**"]
      autoapi_add_nav_entry: "API Reference"
      autoapi_keep_files: false
      autoapi_root: autoapi
  # Include markdown from other files
  - include-markdown
  # Variables and macros in markdown
  - macros
  # Improved code includes
  - codeinclude
  # Meta descriptions for SEO
  - meta-descriptions
  # Minify HTML, JS, and CSS
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  # Other useful plugins
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/ezq
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - User Guide:
      - Events: user-guide/events.md
      - Handlers: user-guide/handlers.md
      - Configuration: user-guide/configuration.md
  # API Reference will be auto-generated by mkdocs-autoapi
