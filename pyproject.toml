[project]
name = "ezq"
version = "0.1.0"
description = "An opinionated queue and event system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "async-lru>=2.0.4",
    "attrs>=25.1.0",
    "tembo-pgmq-python[async]>=0.9.2",
]

[project.optional-dependencies]
dev = ["mypy>=1.15.0", "pytest>=8.3.4"]
doc = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.8.0",
    "pymdown-extensions>=10.7.0",
    "mkdocs-autorefs>=0.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-include-markdown-plugin>=6.0.1",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocs-minify-plugin>=0.7.1",
    "mkdocs-codeinclude-plugin>=0.2.1",
    "mkdocs-meta-descriptions-plugin>=3.0.0",
    "mkdocs-api-autonav>=0.2.1",
]

[tool.mypy]
files = ["src/ezq", "src/ezvent", "_main.py"]
